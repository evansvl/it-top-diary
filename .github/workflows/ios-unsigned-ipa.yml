name: iOS unsigned IPA (Sideloadly/AltStore)

# Собирает НЕПОДПИСАННЫЙ .ipa с device-бинарником (arm64) на бесплатном
# macOS-раннере. Такой .ipa нельзя поставить напрямую, но его пере-подписывает
# Sideloadly/AltStore вашим бесплатным Apple ID (срок жизни подписи — 7 дней).
# Запуск вручную: вкладка Actions → этот workflow → Run workflow.

on:
  workflow_dispatch:

jobs:
  build:
    # macos-15 несёт Xcode 16.x (RN 0.86 требует >= 16.1).
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        # expo-modules-jsi требует Swift tools 6.2. Закрепляем toolchain вместо
        # автоматического выбора самой новой версии на меняющемся runner.
        run: |
          XCODE="/Applications/Xcode_26.2.0.app"
          test -d "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm ci --legacy-peer-deps

      - name: Patch ExpoModulesJSI for Swift 6.2
        # В expo-modules-jsi 57.0.4 глобальный abs() неоднозначен для Swift 6.2.
        # Проверки до/после делают временный патч явным и fail-fast, если
        # upstream изменит строку или выпустит исправление.
        run: |
          FILE="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Coding/JavaScriptCodable+Date.swift"
          grep -F 'abs(milliseconds) <= maxJavaScriptDateMilliseconds' "$FILE"
          sed -i '' 's/abs(milliseconds) <=/Swift.abs(milliseconds) <=/' "$FILE"
          grep -F 'Swift.abs(milliseconds) <= maxJavaScriptDateMilliseconds' "$FILE"

      - name: Expo prebuild (iOS native project)
        run: npx expo prebuild -p ios --no-install
        env:
          CI: 1

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Resolve workspace and scheme
        id: xc
        run: |
          WS=$(ls ios | grep '\.xcworkspace$' | head -1)
          # Схема приложения = имя .xcodeproj (а не первая из workspace —
          # там первым идёт под-схема CocoaPods вроде EXConstants).
          SCHEME=$(ls ios | grep '\.xcodeproj$' | head -1 | sed 's/\.xcodeproj$//')
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WS  Scheme: $SCHEME"

      - name: Build (device, no code signing)
        run: |
          set -eo pipefail
          xcodebuild \
            -workspace "ios/${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned .ipa
        run: |
          set -eo pipefail
          PRODUCTS="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos"
          echo "--- products ---"; ls -la "$PRODUCTS" || true
          APP=$(find "$PRODUCTS" -maxdepth 1 -type d -name '*.app' | head -1 || true)
          if [ -z "$APP" ]; then
            echo "::error::No .app in $PRODUCTS"; exit 1
          fi
          echo "Using: $APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qr ittop-unsigned.ipa Payload)
          ls -lh "$RUNNER_TEMP/ittop-unsigned.ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ittop-unsigned-ipa
          path: ${{ runner.temp }}/ittop-unsigned.ipa
          if-no-files-found: error
